# CIFAR-10 Flow Matching with Perceiver IO (Tiny) Configuration
# Minimal model size for rapid prototyping and debugging

model_type: "flow_matching"

# Model architecture (tiny version)
model:
  type: "perceiver_io_fm"
  image_size: 32
  channel: 3
  latent_dim: 128       # Very small
  num_latents: 64       # Very few latents
  depth: 3              # Shallow
  num_heads: 4
  head_dim: 32          # Reduced head dim
  input_fourier_features: 16   # Minimal Fourier features
  query_fourier_features: 16

# Flow Matching parameters
flow:
  integration_method: "euler"

# Dataset
dataset:
  name: "cifar10"
  root: "./data"
  train: true
  augment_horizontal_flip: false
  batch_size: 256  # Large batch for tiny model
  num_workers: 4

# Sparsity configuration
sparsity:
  mode: "fixed_instance"  # Fixed random mask per image instance
  pattern: "random"  # Random sparse sampling
  sparsity: 0.2
  block_size: 5
  num_blocks: 6
  grid_stride: 4

# Training
training:
  num_steps: 200000
  lr: 0.0003  # Higher LR for tiny model
  weight_decay: 0.0
  betas: [0.9, 0.999]
  max_grad_norm: 1.0
  clip_sampling: true
  sampling_steps: 50

  # Super-resolution (Perceiver naturally handles different resolutions)
  target_size: null  # [64, 64] or [128, 128]

  # Logging
  log_every: 100
  sample_every: 2500
  save_every: 10000

# Paths
save_dir: "./results/cifar10_fm_perceiver_tiny"
device: "cuda"
seed: 42
